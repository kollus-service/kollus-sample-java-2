<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Kollus 파일 업로드</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <style>
        .file-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .file-area:hover, .file-area.drag-over { border-color: #4f46e5; background: #f5f3ff; }
        .file-area input { display: none; }
        .file-area .icon { font-size: 2rem; margin-bottom: 8px; }
        .file-area .hint { font-size: .85rem; color: #888; margin-top: 4px; }
        .file-name { font-size: .9rem; color: #4f46e5; font-weight: 500; margin-top: 8px; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <h1>Kollus 콘텐츠 업로드</h1>

    <div class="card">
        <div class="field">
            <label for="apiToken">API 토큰:</label>
            <input id="apiToken" type="text" th:value="${defaultApiToken}">
        </div>

        <div class="field" style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="is-passthrough" style="width:16px; height:16px; cursor:pointer;">
            <label for="is-passthrough" style="margin:0; cursor:pointer;">패스스루 업로드 (인코딩 없이 원본 그대로 저장)</label>
        </div>

        <div class="field" id="field-title">
            <label for="title">제목 <span style="color:#aaa; font-weight:400;">(선택 — 미입력 시 파일명 사용)</span></label>
            <input type="text" id="title" placeholder="미입력 시 파일명으로 저장됩니다">
        </div>

        <div class="field" id="field-profile-key" style="display:none;">
            <label for="profileKey">인코딩 프로파일 키 <span style="color:#e11d48;">*</span></label>
            <input type="text" id="profileKey" placeholder="패스스루 업로드에 사용할 프로파일 키를 입력하세요">
        </div>

        <div class="field">
            <label for="categoryKey">카테고리 키 <span style="color:#aaa; font-weight:400;">(선택)</span></label>
            <input id="categoryKey" type="text" th:value="${defaultCategoryKey}" placeholder="미입력 시 기본 카테고리에 저장됩니다">
        </div>

        <div class="field">
            <label for="expireTime">업로드 URL 유효 시간 (초)</label>
            <input type="number" id="expireTime" value="600" min="60" max="21600">
        </div>

        <div class="field" id="field-encryption">
            <label for="isEncryption">암호화:</label>
            <select id="isEncryption">
                <option value="1">암호화 콘텐츠</option>
                <option value="0">비암호화(일반) 콘텐츠</option>
            </select>
        </div>

        <div class="field">
            <label for="isAudio">콘텐츠 유형:</label>
            <select id="isAudio">
                <option value="0">비디오</option>
                <option value="1">오디오 전용</option>
            </select>
        </div>

        <div class="field">
            <label>파일 <span style="color:#e11d48;">*</span></label>
            <!-- Kollus 업로드 서버는 실제 form 제출(페이지 네비게이션)을 전제로 설계되어 있어
                 이 form의 action/target을 JS로 바꿔 hidden iframe에 제출한다 -->
            <form id="uploadForm" method="post" enctype="multipart/form-data" style="margin:0;">
                <input type="hidden" name="disable_alert" value="1">
                <input type="hidden" name="redirection_scope" value="no">
                <div class="file-area" id="file-area">
                    <input id="fileInput" name="upload-file" type="file" accept="video/*,audio/*">
                    <div class="icon">📁</div>
                    <div>클릭하거나 파일을 여기에 드래그하세요</div>
                    <div class="hint">video/*, audio/* 형식 지원</div>
                    <div class="file-name" id="file-name" style="display:none"></div>
                </div>
            </form>
        </div>

        <button id="uploadBtn" type="button" class="btn" style="width:100%;">업로드 시작</button>

        <div id="progress-section" style="display:none; margin-top: 20px;">
            <div class="progress-label">
                <span id="progress-status">업로드 진행률</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <div id="status-msg" class="msg"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const passthroughCheckbox = document.getElementById('is-passthrough');
    const fieldTitle = document.getElementById('field-title');
    const fieldProfileKey = document.getElementById('field-profile-key');
    const fieldEncryption = document.getElementById('field-encryption');

    passthroughCheckbox.addEventListener('change', () => {
        const checked = passthroughCheckbox.checked;
        fieldTitle.style.display = checked ? 'none' : '';
        fieldEncryption.style.display = checked ? 'none' : '';
        fieldProfileKey.style.display = checked ? '' : 'none';
        if (!checked) {
            document.getElementById('profileKey').value = '';
        }
    });

    const fileArea = document.getElementById('file-area');
    const fileInput = document.getElementById('fileInput');
    const fileNameEl = document.getElementById('file-name');

    fileArea.addEventListener('click', () => fileInput.click());
    fileArea.addEventListener('dragover', (e) => { e.preventDefault(); fileArea.classList.add('drag-over'); });
    fileArea.addEventListener('dragleave', () => fileArea.classList.remove('drag-over'));
    fileArea.addEventListener('drop', (e) => {
        e.preventDefault();
        fileArea.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) setFile(file);
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(file) {
        // 드래그앤드롭으로 받은 파일을 실제 form의 file input에 동기화한다
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        fileNameEl.textContent = file.name + ' (' + formatBytes(file.size) + ')';
        fileNameEl.style.display = 'block';
    }

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 ** 2) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1024 ** 3) return (bytes / 1024 ** 2).toFixed(1) + ' MB';
        return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status-msg');
        el.textContent = msg;
        el.className = 'msg ' + type;
        el.style.display = 'block';
    }

    let progressPollIntervalId = null;

    /**
     * create-url 응답의 progress_url을 5초 간격으로 폴링해 업로드 진행률을 갱신한다.
     * form+iframe 제출은 cross-origin이라 전송 성공/실패를 JS로 직접 읽을 수 없으므로,
     * 완료 판단은 전적으로 이 폴링 결과(진행률 100%)에 의존한다.
     */
    function startProgressUrlPolling(progressUrl, uploadBtn, uploadFileKey) {
        if (progressPollIntervalId) clearInterval(progressPollIntervalId);

        const progressBar = document.getElementById('progress-bar');
        const progressPct = document.getElementById('progress-pct');

        const poll = async () => {
            try {
                const res = await fetch(progressUrl);
                const data = await res.json();
                if (data.error !== 0) {
                    console.error('[Kollus] Progress URL Error:', data.message);
                    return;
                }
                const pct = data.result.progress;
                progressBar.style.width = pct + '%';
                progressPct.textContent = pct + '%';
                if (pct >= 100) {
                    clearInterval(progressPollIntervalId);
                    progressPollIntervalId = null;
                    uploadBtn.textContent = '업로드 완료';
                    uploadBtn.disabled = false;
                    showStatus('업로드가 완료되었습니다. 파일 키: ' + uploadFileKey, 'success');
                }
            } catch (error) {
                console.error('[Kollus] Progress URL fetch failed:', error);
            }
        };

        poll();
        progressPollIntervalId = setInterval(poll, 5000);
    }

    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const uploadBtn = document.getElementById('uploadBtn');
        const file = fileInput.files[0];
        const isPassthrough = passthroughCheckbox.checked;
        const profileKey = document.getElementById('profileKey').value.trim();

        if (!file) { showStatus('파일을 선택해 주세요.', 'error'); return; }
        if (isPassthrough && !profileKey) { showStatus('인코딩 프로파일 키를 입력해 주세요.', 'error'); return; }

        try {
            uploadBtn.disabled = true;
            uploadBtn.textContent = '처리 중...';
            document.getElementById('status-msg').style.display = 'none';

            // 1. 업로드 URL 발급
            const response = await fetch('/api/upload/create-url', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    access_token: document.getElementById('apiToken').value,
                    title: document.getElementById('title').value,
                    file_name: file.name,
                    category_key: document.getElementById('categoryKey').value,
                    expire_time: document.getElementById('expireTime').value,
                    is_encryption_upload: document.getElementById('isEncryption').value,
                    is_audio_upload: document.getElementById('isAudio').value,
                    is_passthrough: isPassthrough ? '1' : '0',
                    profile_key: profileKey,
                })
            });

            const result = await response.json();

            // 일반 업로드 응답: {status:"ok", data:{...}} / 패스스루 응답: {error:0, message:"", result:{...}}
            const ok = isPassthrough ? result.error === 0 : result.status === 'ok';
            const data = isPassthrough ? result.result : result.data;
            if (!ok) throw new Error(JSON.stringify(result.error || result));

            const uploadUrl = data.upload_url;
            const progressUrl = data.progress_url;
            const uploadFileKey = data.upload_file_key;

            // 2. 파일 업로드 — Kollus 업로드 서버는 실제 <form> 제출(브라우저 네비게이션)을 전제로
            // 설계되어 있어, fetch/XHR로 upload_url에 직접 요청하면 CORS preflight에 막힌다.
            // hidden iframe을 target으로 하는 실제 form 제출로 우회한다.
            let uploadIframe = document.getElementById('uploadIframe');
            if (!uploadIframe) {
                uploadIframe = document.createElement('iframe');
                uploadIframe.id = 'uploadIframe';
                uploadIframe.name = 'uploadIframe';
                uploadIframe.style.display = 'none';
                document.body.appendChild(uploadIframe);
            }

            const uploadForm = document.getElementById('uploadForm');
            uploadForm.action = uploadUrl;
            uploadForm.target = 'uploadIframe';

            uploadBtn.textContent = '업로드 중...';
            showStatus('업로드 요청을 전송했습니다. 파일 키: ' + uploadFileKey, 'info');
            document.getElementById('progress-section').style.display = 'block';
            startProgressUrlPolling(progressUrl, uploadBtn, uploadFileKey);
            uploadForm.submit();

        } catch (error) {
            console.error('[Kollus] Upload Error:', error);
            showStatus('업로드 실패: ' + error.message, 'error');
            uploadBtn.textContent = '업로드 시작';
            uploadBtn.disabled = false;
        }
    });
}());
</script>
</body>
</html>
