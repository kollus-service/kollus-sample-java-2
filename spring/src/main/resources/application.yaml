spring:
  application:
    name: kollus
  # 로컬 민감정보(application-local.yaml)를 기본으로 로드
  profiles:
    active: local
  thymeleaf:
    cache: false

server:
  port: 8080

# Kollus 연동 설정
# 민감 정보(security-key, custom-key, api-token, category-key)는 커밋 대상이 아닌
# application-local.yaml 에서 주입합니다. (application-local.yaml.example 참고)
kollus:
  security-key: ""
  custom-key: ""
  api-token: ""
  category-key: ""
  # 샘플 플레이어 페이지에 기본 노출할 MCK — 실제 서비스에서는 제거
  sample-mck: ""
  # 다음 회차 기능 샘플 MCK 목록 (콤마 구분, 예: "mckA,mckB")
  next-episode-mcks: ""
  # 멀티 DRM(DoveRunner) 재생 — 일반 재생과 별도 Kollus 계정 + DoveRunner 계정 키 사용.
  # 민감 정보(multidrm.*, doverunner.access-key/site-key/site-id)는 application-local.yaml 에서 주입합니다.
  multidrm:
    security-key: ""
    custom-key: ""
  doverunner:
    access-key: ""
    site-key: ""
    site-id: ""
    iv: "0123456789abcdef"
    license-url: "https://drm-license.doverunner.com/ri/licenseManager.do"
    certificate-url: "https://drm-license.doverunner.com/ri/fpsKeyManager.do"